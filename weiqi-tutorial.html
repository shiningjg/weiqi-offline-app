<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>围棋规则演示 · 打吃 / 提子 / 活棋</title>
<style>
  :root{
    --bg:#120c07; --card:#1e1610; --wood:#d6a441; --wood2:#c8912f;
    --gold:#e3b06b; --txt:#f3e9d8; --muted:#b9a98c; --eye:#ffd34d; --last:#e23b3b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(130% 120% at 50% 0%,#2a2014 0%,#0e0a06 100%);color:var(--txt);
    padding:24px 14px 50px}
  .wrap{max-width:760px;margin:0 auto}
  h1{text-align:center;font-size:26px;margin:6px 0 2px;letter-spacing:1px}
  .lead{text-align:center;color:var(--gold);font-size:14px;margin-bottom:22px;line-height:1.7}
  .card{background:var(--card);border:1px solid rgba(227,176,107,.22);border-radius:18px;
    padding:18px 16px 20px;margin-bottom:22px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .card h2{font-size:18px;color:var(--gold);margin:0 0 4px;display:flex;align-items:center;gap:8px}
  .tag{font-size:11px;background:rgba(227,176,107,.16);color:var(--gold);padding:2px 8px;border-radius:20px;font-weight:600}
  .stage{display:flex;justify-content:center;margin:8px 0 6px}
  svg{width:100%;max-width:340px;height:auto;border-radius:12px;display:block}
  .cap{min-height:54px;font-size:14.5px;line-height:1.7;padding:10px 12px;background:rgba(0,0,0,.25);
    border-radius:10px;margin:6px 2px 12px;color:var(--txt)}
  .cap b{color:var(--gold)}
  .ctrl{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
  .ctrl button{border:none;border-radius:10px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;
    background:rgba(227,176,107,.18);color:var(--txt);transition:.15s}
  .ctrl button:hover{background:rgba(227,176,107,.32)}
  .ctrl button:disabled{opacity:.35;cursor:default}
  .ctrl button.primary{background:linear-gradient(135deg,#e3b06b,#cf9138);color:#2a1c08}
  .dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
  .dot{width:8px;height:8px;border-radius:50%;background:rgba(227,176,107,.25)}
  .dot.on{background:var(--gold);transform:scale(1.25)}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:14px;line-height:1.7}
  /* 棋子动画 */
  .stone{opacity:0;transform:scale(.2);transform-box:fill-box;transform-origin:center;
    transition:opacity .35s ease, transform .4s cubic-bezier(.2,1.5,.4,1)}
  .stone.show{opacity:1;transform:scale(1)}
  .stone.hide{opacity:0;transform:scale(.2)}
  .eye{animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:.95}}
</style>
</head>
<body>
<div class="wrap">
  <h1>围棋规则可视化演示</h1>
  <div class="lead">用动画看懂四件事：<b>气</b>与<b>打吃</b> → <b>提子</b> → 怎么把棋做成<b>活棋</b> → 还有<b>千万别自填眼</b>。<br>点「下一步」看每一步，或点「自动播放」。</div>

  <div class="card">
    <h2>① 气 与 打吃 <span class="tag">5×5</span></h2>
    <div class="stage"><svg id="svg1" viewBox="0 0 300 300"></svg></div>
    <div class="cap" id="cap1"></div>
    <div class="ctrl">
      <button id="prev1">◀ 上一步</button>
      <button id="play1" class="primary">▶ 自动播放</button>
      <button id="next1">下一步 ▶</button>
    </div>
    <div class="dots" id="dots1"></div>
  </div>

  <div class="card">
    <h2>② 提子（整块被提） <span class="tag">5×5</span></h2>
    <div class="stage"><svg id="svg2" viewBox="0 0 300 300"></svg></div>
    <div class="cap" id="cap2"></div>
    <div class="ctrl">
      <button id="prev2">◀ 上一步</button>
      <button id="play2" class="primary">▶ 自动播放</button>
      <button id="next2">下一步 ▶</button>
    </div>
    <div class="dots" id="dots2"></div>
  </div>

  <div class="card">
    <h2>③ 活棋（两个真眼） <span class="tag">7×7</span></h2>
    <div class="stage"><svg id="svg3" viewBox="0 0 332 332"></svg></div>
    <div class="cap" id="cap3"></div>
    <div class="ctrl">
      <button id="prev3">◀ 上一步</button>
      <button id="play3" class="primary">▶ 自动播放</button>
      <button id="next3">下一步 ▶</button>
    </div>
    <div class="dots" id="dots3"></div>
  </div>

  <div class="card">
    <h2>④ 自填眼 = 送死 <span class="tag">7×7</span></h2>
    <div class="stage"><svg id="svg4" viewBox="0 0 332 332"></svg></div>
    <div class="cap" id="cap4"></div>
    <div class="ctrl">
      <button id="prev4">◀ 上一步</button>
      <button id="play4" class="primary">▶ 自动播放</button>
      <button id="next4">下一步 ▶</button>
    </div>
    <div class="dots" id="dots4"></div>
  </div>

  <footer>演示只展示规则原理；实战中棋子形状千变万化，但「有没有气」「能不能做两个眼」「别填自己的眼」永远是核心。</footer>
</div>

<script>
const SVGNS="http://www.w3.org/2000/svg";

// 棋形定义：board 用 "gx,gy":1(黑)/2(白)；eyes 高亮空点；last 最后一手
const SCEN = [
  { // ① 打吃
    svg:"svg1", cap:"cap1", dots:"dots1", prev:"prev1", next:"next1", play:"play1",
    size:5, cell:58, margin:34,
    steps:[
      {board:{"2,2":1}, eyes:["1,2","3,2","2,1","2,3"],
       text:"一颗黑子上下左右有 <b>4 口气</b>（黄点）。气越多越安全，没气就死。"},
      {board:{"2,2":1,"1,2":2}, eyes:["3,2","2,1","2,3"], last:"1,2",
       text:"白子堵住左边一口，黑子剩 <b>3 口气</b>。"},
      {board:{"2,2":1,"1,2":2,"2,1":2}, eyes:["3,2","2,3"], last:"2,1",
       text:"再堵上面一口，黑子剩 <b>2 口气</b>。"},
      {board:{"2,2":1,"1,2":2,"2,1":2,"3,2":2}, eyes:["2,3"], last:"3,2",
       text:"黑子只剩<b>最后一口气</b>（右下黄点）——这叫<b>「打吃」</b>，再被堵一口就死。"},
      {board:{"1,2":2,"2,1":2,"3,2":2,"2,3":2}, eyes:[], last:"2,3",
       text:"白子落最后一口气 → 黑子无气，被整块提走。这就是下一节要讲的<b>提子</b>。"}
    ]
  },
  { // ② 提子
    svg:"svg2", cap:"cap2", dots:"dots2", prev:"prev2", next:"next2", play:"play2",
    size:5, cell:58, margin:34,
    steps:[
      {board:{"2,2":1}, eyes:["1,2","3,2","2,1","2,3"],
       text:"先回到一颗黑子，周围 <b>4 口气</b>。"},
      {board:{"2,2":1,"1,2":2,"2,1":2,"2,3":2}, eyes:["3,2"], last:"2,3",
       text:"白子三面围住，黑子被打吃到只剩 <b>1 口气</b>（右边黄点）。"},
      {board:{"3,2":2,"1,2":2,"2,1":2,"2,3":2}, eyes:[], last:"3,2",
       text:"白子落最后一口气 → 黑子<b>整块无气</b>，被一次性提走。提子只看「有没有气」，不看几颗——整块一起没。"}
    ]
  },
  { // ③ 活棋（双真眼）
    svg:"svg3", cap:"cap3", dots:"dots3", prev:"prev3", next:"next3", play:"play3",
    size:7, cell:46, margin:28,
    steps:[
      {board:{
         "1,2":1,"2,2":1,"3,2":1,"4,2":1,"5,2":1,
         "1,3":1,"5,3":1,"3,3":1,
         "1,4":1,"2,4":1,"3,4":1,"4,4":1,"5,4":1,
         "0,1":2,"1,1":2,"2,1":2,"3,1":2,"4,1":2,"5,1":2,"6,1":2,
         "0,5":2,"1,5":2,"2,5":2,"3,5":2,"4,5":2,"5,5":2,"6,5":2,
         "0,2":2,"0,3":2,"0,4":2,"6,2":2,"6,3":2,"6,4":2
       }, eyes:["2,3","4,3"],
       text:"黑棋围出 <b>两个独立空点</b>（黄点＝真眼），白棋把外面全围住了。注意：每个眼的四边都是黑子。"},
      {board:{
         "1,2":1,"2,2":1,"3,2":1,"4,2":1,"5,2":1,
         "1,3":1,"5,3":1,"3,3":1,"2,3":2,
         "1,4":1,"2,4":1,"3,4":1,"4,4":1,"5,4":1,
         "0,1":2,"1,1":2,"2,1":2,"3,1":2,"4,1":2,"5,1":2,"6,1":2,
         "0,5":2,"1,5":2,"2,5":2,"3,5":2,"4,5":2,"5,5":2,"6,5":2,
         "0,2":2,"0,3":2,"0,4":2,"6,2":2,"6,3":2,"6,4":2
       }, eyes:["4,3"], last:"2,3",
       text:"白子想填左边的眼……"},
      {board:{
         "1,2":1,"2,2":1,"3,2":1,"4,2":1,"5,2":1,
         "1,3":1,"5,3":1,"3,3":1,
         "1,4":1,"2,4":1,"3,4":1,"4,4":1,"5,4":1,
         "0,1":2,"1,1":2,"2,1":2,"3,1":2,"4,1":2,"5,1":2,"6,1":2,
         "0,5":2,"1,5":2,"2,5":2,"3,5":2,"4,5":2,"5,5":2,"6,5":2,
         "0,2":2,"0,3":2,"0,4":2,"6,2":2,"6,3":2,"6,4":2
       }, eyes:["2,3","4,3"],
       text:"白子落进去后，它的四个邻点<b>全是黑子</b> → 白子自己没气、又提不掉黑子，属于<b>「自杀」</b>被提走。黑棋两个眼都保住，<b>永远填不死 → 这就是活棋</b>。"}
    ]
  },
  { // ④ 自填眼送死
    svg:"svg4", cap:"cap4", dots:"dots4", prev:"prev4", next:"next4", play:"play4",
    size:7, cell:46, margin:28,
    steps:[
      {board:{
         "1,2":1,"2,2":1,"3,2":1,"4,2":1,"5,2":1,
         "1,3":1,"5,3":1,"3,3":1,
         "1,4":1,"2,4":1,"3,4":1,"4,4":1,"5,4":1,
         "0,1":2,"1,1":2,"2,1":2,"3,1":2,"4,1":2,"5,1":2,"6,1":2,
         "0,5":2,"1,5":2,"2,5":2,"3,5":2,"4,5":2,"5,5":2,"6,5":2,
         "0,2":2,"0,3":2,"0,4":2,"6,2":2,"6,3":2,"6,4":2
       }, eyes:["2,3","4,3"],
       text:"先回到刚才的活棋形状：黑棋围出<b>两个真眼</b>（黄点），本应是<b>活棋</b>——白子填不进你的眼。记住这个局面。"},
      {board:{
         "1,2":1,"2,2":1,"3,2":1,"4,2":1,"5,2":1,
         "1,3":1,"5,3":1,"3,3":1,"2,3":1,
         "1,4":1,"2,4":1,"3,4":1,"4,4":1,"5,4":1,
         "0,1":2,"1,1":2,"2,1":2,"3,1":2,"4,1":2,"5,1":2,"6,1":2,
         "0,5":2,"1,5":2,"2,5":2,"3,5":2,"4,5":2,"5,5":2,"6,5":2,
         "0,2":2,"0,3":2,"0,4":2,"6,2":2,"6,3":2,"6,4":2
       }, eyes:["4,3"], last:"2,3",
       text:"但<b>你自己</b>（黑）要是手贱，在<strong>自己的眼(2,3)里落一子</strong>——这一步合法，却把<b>双活眼变成单眼</b>（只剩右边黄点）。注意：这是<b>你自己送的</b>，白棋无法强迫你填眼。"},
      {board:{
         "0,1":2,"1,1":2,"2,1":2,"3,1":2,"4,1":2,"5,1":2,"6,1":2,
         "0,5":2,"1,5":2,"2,5":2,"3,5":2,"4,5":2,"5,5":2,"6,5":2,
         "0,2":2,"0,3":2,"0,4":2,"6,2":2,"6,3":2,"6,4":2,
         "4,3":2
       }, eyes:[], last:"4,3",
       text:"白子落进<strong>最后一个眼(4,3)</strong> → 黑块<b>彻底无气，14颗黑子被整块提走</b>！看棋盘：黑子全没了。<br><b>结论：活棋＝对手填不了(自杀禁着) ＋ 你自己不犯蠢(不填眼)。</b>"}
    ]
  }
];

function buildBoard(sc){
  const svg=document.getElementById(sc.svg);
  svg.innerHTML="";
  const N=sc.size, cell=sc.cell, m=sc.margin;
  const S=m*2+(N-1)*cell;
  const px=g=>m+g*cell, py=g=>m+g*cell;
  // 木色底
  const wood=document.createElementNS(SVGNS,"rect");
  wood.setAttribute("x",0);wood.setAttribute("y",0);wood.setAttribute("width",S);wood.setAttribute("height",S);
  wood.setAttribute("rx",12);wood.setAttribute("fill","#d6a441");
  svg.appendChild(wood);
  // 网格线
  for(let i=0;i<N;i++){
    [[px(0),py(i),px(N-1),py(i)],[px(i),py(0),px(i),py(N-1)]].forEach(seg=>{
      const l=document.createElementNS(SVGNS,"line");
      l.setAttribute("x1",seg[0]);l.setAttribute("y1",seg[1]);l.setAttribute("x2",seg[2]);l.setAttribute("y2",seg[3]);
      l.setAttribute("stroke","#6b4a1c");l.setAttribute("stroke-width",1.4);
      svg.appendChild(l);
    });
  }
  // 星位
  const stars=starPoints(N);
  stars.forEach(p=>{
    const c=document.createElementNS(SVGNS,"circle");
    c.setAttribute("cx",px(p[0]));c.setAttribute("cy",py(p[1]));c.setAttribute("r",3.2);
    c.setAttribute("fill","#5a3d16");svg.appendChild(c);
  });
  const gStones=document.createElementNS(SVGNS,"g"); svg.appendChild(gStones);
  const gEyes=document.createElementNS(SVGNS,"g"); svg.appendChild(gEyes);
  const gMarks=document.createElementNS(SVGNS,"g"); svg.appendChild(gMarks);
  return {svg,gStones,gEyes,gMarks,px,py,cell};
}

function starPoints(N){
  if(N<5) return [];
  if(N===5) return [[2,2]];
  if(N===7) return [[2,2],[4,2],[2,4],[4,4],[3,3]];
  // 9 及以上标准
  const e=N-4, m=(N-1)/2;
  return [[2,2],[e,2],[2,e],[e,e],[m,m]];
}

function makeStone(gx,gy,color,geo){
  const c=document.createElementNS(SVGNS,"circle");
  c.setAttribute("cx",geo.px(gx));c.setAttribute("cy",geo.py(gy));c.setAttribute("r",geo.cell*0.42);
  c.setAttribute("class","stone "+(color===1?"black":"white"));
  if(color===1){
    const grad=document.createElementNS(SVGNS,"radialGradient");
    grad.id="gB"+gx+"_"+gy+Math.random().toString(36).slice(2,6);
    grad.innerHTML='<stop offset="0%" stop-color="#555"/><stop offset="55%" stop-color="#1c1c20"/><stop offset="100%" stop-color="#000"/>';
    c.parentNode && c.parentNode.insertBefore(grad,c);
    c.setAttribute("fill","#161618");
    c.setAttribute("stroke","#000");c.setAttribute("stroke-width",1);
  }else{
    c.setAttribute("fill","#fafafa");c.setAttribute("stroke","#b8b8c0");c.setAttribute("stroke-width",1.4);
  }
  // 阴影
  c.setAttribute("filter","drop-shadow(1px 2px 2px rgba(0,0,0,.4))");
  return c;
}

function renderStep(sc, idx){
  const geo=sc._geo, step=sc.steps[idx];
  const target=step.board||{};
  const tKeys=Object.keys(target);
  // 删除/保留
  for(const [key,rec] of sc._cur){
    if(!tKeys.includes(key)){
      rec.el.classList.add("hide");
      const el=rec.el;
      el.addEventListener("transitionend",()=>el.remove(),{once:true});
      sc._cur.delete(key);
    }
  }
  // 新增
  tKeys.forEach(key=>{
    if(!sc._cur.has(key)){
      const [gx,gy]=key.split(",").map(Number);
      const el=makeStone(gx,gy,target[key],geo);
      geo.gStones.appendChild(el);
      sc._cur.set(key,{el,color:target[key]});
      requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add("show")));
    }
  });
  // 眼高亮
  geo.gEyes.innerHTML="";
  (step.eyes||[]).forEach(key=>{
    const [gx,gy]=key.split(",").map(Number);
    const c=document.createElementNS(SVGNS,"circle");
    c.setAttribute("cx",geo.px(gx));c.setAttribute("cy",geo.py(gy));c.setAttribute("r",geo.cell*0.16);
    c.setAttribute("fill","var(--eye)");c.setAttribute("class","eye");
    geo.gEyes.appendChild(c);
  });
  // 最后一手标记
  geo.gMarks.innerHTML="";
  if(step.last){
    const [gx,gy]=step.last.split(",").map(Number);
    const c=document.createElementNS(SVGNS,"circle");
    c.setAttribute("cx",geo.px(gx));c.setAttribute("cy",geo.py(gy));c.setAttribute("r",geo.cell*0.13);
    c.setAttribute("fill","var(--last)");
    geo.gMarks.appendChild(c);
  }
  // 文字
  document.getElementById(sc.cap).innerHTML=step.text;
  // 进度点
  const dots=document.getElementById(sc.dots); dots.innerHTML="";
  sc.steps.forEach((_,i)=>{
    const d=document.createElement("span");
    d.className="dot"+(i===idx?" on":"");
    dots.appendChild(d);
  });
  sc._idx=idx;
  document.getElementById(sc.prev).disabled=(idx===0);
  document.getElementById(sc.next).disabled=(idx===sc.steps.length-1);
}

function initScenario(sc){
  sc._geo=buildBoard(sc);
  sc._cur=new Map();
  sc._idx=0;
  renderStep(sc,0);
  document.getElementById(sc.prev).onclick=()=>{ stopPlay(sc); if(sc._idx>0) renderStep(sc,sc._idx-1); };
  document.getElementById(sc.next).onclick=()=>{ stopPlay(sc); if(sc._idx<sc.steps.length-1) renderStep(sc,sc._idx+1); };
  document.getElementById(sc.play).onclick=()=>{
    if(sc._timer){ stopPlay(sc); return; }
    document.getElementById(sc.play).textContent="⏸ 暂停";
    const tick=()=>{
      if(sc._idx>=sc.steps.length-1){ stopPlay(sc); return; }
      renderStep(sc,sc._idx+1);
      sc._timer=setTimeout(tick,1300);
    };
    sc._timer=setTimeout(tick,400);
  };
}
function stopPlay(sc){
  if(sc._timer){ clearTimeout(sc._timer); sc._timer=null; }
  document.getElementById(sc.play).textContent="▶ 自动播放";
}

SCEN.forEach(initScenario);
</script>
</body>
</html>
